[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Agentic AI Chatbot with Gemini, Groq, FAISS RAG, and Tavily"
readme = "README.md"
authors = [
    { name = "Ankur-one", email = "2005ankurkumar@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu",
    "google-genai",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-tavily",
    "langchain-text-splitters",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic",
    "pypdf",
    "python-dotenv",
    "streamlit",
    "tavily-python",
]

[project.scripts]
agentic-chatbot = "agentic_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
